name: Build iStoreOS‑armsr Docker Image
permissions:
  contents: read
  packages: write
on:
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/sherry2023218/istoreos‑armsr:latest

jobs:
  build:
    runs-on: ubuntu‑22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y tar zstd wget curl bzip2 tree

      - name: Cache ImageBuilder tar.zst
        uses: actions/cache@v4
        with:
          path: |
            targets/armsr/imagebuilder.tar.zst
            targets/armsr/Makefile
            targets/armsr/package
            targets/armsr/target
          key: ib‑armsr‑armv8‑20260904

      - name: Download iStoreOS ImageBuilder armsr (arm64)
        run: |
          cd targets/armsr
          if [ ! -f "imagebuilder.tar.zst" ];then
            wget --tries=10 --retry‑connrefused -O imagebuilder.tar.zst "https://fw0.koolcenter.com/iStoreOS/ib/armsr/istoreos-imagebuilder-armsr-armv8.Linux-x86_64.tar.zst"
          fi
          # Makefile存在说明已经解压完成，跳过解压
          if [ ! -f "Makefile" ];then
            tar -I zstd -xf imagebuilder.tar.zst --strip‑components=1
          fi

      - name: Fix uci‑defaults execute permission
        run: |
          mkdir -p targets/armsr/files/etc/uci‑defaults
          chmod +x targets/armsr/files/etc/uci‑defaults/* 2>/dev/null || true

      - name: Execute build.sh generate rootfs.tar.gz
        run: |
          cd targets/armsr
          chmod +x ./build.sh
          ./build.sh
        # ❗移除 continue‑on‑error，构建失败直接终止job

      # -------- 参考wukong：构建完成立刻打印产物目录，提前暴露问题 --------
      - name: Show build output files
        run: |
          cd targets/armsr
          echo "==== Search rootfs.tar.gz ===="
          find . -name "rootfs.tar.gz"
          echo "==== bin directory ===="
          ls -la bin/targets/armsr/generic/

      - name: Upload rootfs artifact
        uses: actions/upload‑artifact@v4
        with:
          name: rootfs‑artifact
          path: targets/armsr/bin/targets/armsr/generic/rootfs.tar.gz

      - name: Copy rootfs.tar.gz to context root
        run: |
          cp targets/armsr/bin/targets/armsr/generic/rootfs.tar.gz ./

      - name: Set up Docker Buildx
        uses: docker/setup‑buildx‑action@v3

      - name: Login to GHCR
        uses: docker/login‑action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker image
        uses: docker/build‑push‑action@v6
        with:
          context: .
          push: true
          tags: ${{ env.GHCR_IMAGE }}
